<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Background Remover - Free Forever</title>
<script src="https://cdn.jsdelivr.net/npm/@huggingface/transformers@2.17.1/dist/transformers.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 2.5em;
  }
  .subtitle {
    text-align: center;
    opacity: 0.9;
    margin-bottom: 30px;
  }
  .upload-area {
    border: 3px dashed rgba(255,255,255,0.5);
    border-radius: 15px;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    background: rgba(255,255,255,0.05);
  }
  .upload-area:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.8);
  }
  .upload-area.dragover {
    background: rgba(255,255,255,0.2);
  }
  input[type="file"] { display: none; }
  .preview-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 30px;
  }
  .preview-box {
    background: rgba(0,0,0,0.2);
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    min-height: 250px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview-box img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
  }
  .preview-label {
    font-weight: bold;
    margin-bottom: 10px;
    opacity: 0.9;
  }
  .btn {
    background: #fff;
    color: #667eea;
    border: none;
    padding: 15px 40px;
    border-radius: 30px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.2s;
  }
  .btn:hover { transform: scale(1.05); }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .status {
    text-align: center;
    margin-top: 15px;
    min-height: 25px;
    opacity: 0.9;
  }
  .pro-banner {
    background: rgba(255,215,0,0.2);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 10px;
    padding: 15px;
    margin-top: 25px;
    text-align: center;
  }
  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .checker {
    background-image:
      linear-gradient(45deg, #ccc 25%, transparent 25%),
      linear-gradient(-45deg, #ccc 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, 10px 0px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎨 AI Background Remover</h1>
  <p class="subtitle">100% Free • Runs in Your Browser • No Upload to Servers</p>

  <label for="fileInput" class="upload-area" id="uploadArea">
    <p>📤 Click or Drop Image Here</p>
    <p style="font-size:0.9em;opacity:0.7;margin-top:10px">JPG, PNG, WebP — max 10MB</p>
    <input type="file" id="fileInput" accept="image/*">
  </label>

  <div class="preview-row" id="previewRow" style="display:none">
    <div class="preview-box">
      <div class="preview-label">📥 Original</div>
      <img id="originalImg">
    </div>
    <div class="preview-box checker">
      <div class="preview-label">✨ Result</div>
      <img id="resultImg" style="display:none">
      <div id="resultPlaceholder">Processing...</div>
    </div>
  </div>

  <div style="text-align:center">
    <button class="btn" id="downloadBtn" style="display:none" onclick="downloadResult()">
      ⬇️ Download PNG
    </button>
  </div>

  <div class="status" id="status"></div>

  <div class="pro-banner">
    🚀 <strong>Want HD Quality + No Limits?</strong> Pro version coming soon — $9/mo
  </div>
</div>

<script>
let currentResult = null;

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');

uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

async function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    status.textContent = '❌ Please upload an image file';
    return;
  }

  status.innerHTML = '<span class="spinner"></span> Loading AI model (first time only)...';
  document.getElementById('previewRow').style.display = 'grid';
  document.getElementById('originalImg').src = URL.createObjectURL(file);
  document.getElementById('resultImg').style.display = 'none';
  document.getElementById('resultPlaceholder').style.display = 'block';
  document.getElementById('downloadBtn').style.display = 'none';

  try {
    // Use transformers.js to run RMBG model in browser
    const { AutoProcessor, AutoModelForImageSegmentation, RawImage } = window.Transformers;

    status.innerHTML = '<span class="spinner"></span> Downloading model (~40MB, one-time)...';

    const model_id = 'briaai/RMBG-1.4';
    const processor = await AutoProcessor.from_pretrained(model_id, { progress_callback: x => {
      if (x.status === 'progress') {
        status.textContent = `Downloading model: ${Math.round(x.progress || 0)}%`;
      }
    }});
    const model = await AutoModelForImageSegmentation.from_pretrained(model_id, {
      progress_callback: x => {
        if (x.status === 'progress') {
          status.textContent = `Loading: ${Math.round(x.progress || 0)}%`;
        }
      }
    });

    status.innerHTML = '<span class="spinner"></span> Removing background...';

    const img = await RawImage.fromURL(URL.createObjectURL(file));
    const inputs = await processor(img);
    const { output } = await model(inputs);

    const mask = await RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(img.size);
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img.toCanvas(), 0, 0);
    const pixelData = ctx.getImageData(0, 0, img.width, img.height);
    for (let i = 0; i < mask.data.length; ++i) {
      pixelData.data[4*i + 3] = mask.data[i];
    }
    ctx.putImageData(pixelData, 0, 0);

    currentResult = canvas.toDataURL('image/png');
    document.getElementById('resultImg').src = currentResult;
    document.getElementById('resultImg').style.display = 'block';
    document.getElementById('resultPlaceholder').style.display = 'none';
    document.getElementById('downloadBtn').style.display = 'inline-block';
    status.textContent = '✅ Done! Background removed.';

  } catch (err) {
    status.textContent = '❌ Error: ' + err.message;
    console.error(err);
  }
}

function downloadResult() {
  if (!currentResult) return;
  const a = document.createElement('a');
  a.href = currentResult;
  a.download = 'no-background.png';
  a.click();
}
</script>
</body>
</html>
